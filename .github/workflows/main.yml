name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    runs-on: macos-latest
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # INDISPENSABILE per caricare il sottomodulo VoodooInput del progetto

      - uses: actions/checkout@v7
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
          
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1

      - run: xcodebuild -jobs 1 -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$(pwd)/build"
      - run: xcodebuild -jobs 1 -configuration Release CODE_SIGNING_ALLOWED=NO SYMROOT="$(pwd)/build"

      - name: Zip Kexts for Delivery
        run: |
          mkdir -p Products
          
          # Trova la kext di Debug ovunque si trovi dentro build/
          DEBUG_KEXT_PATH=$(find build -type d -name "AlpsHID.kext" | grep -i "debug" | head -n 1)
          if [ -n "$DEBUG_KEXT_PATH" ]; then
            echo "Kext Debug trovata in: $DEBUG_KEXT_PATH"
            # Ottiene la cartella che la contiene (es. .../Debug) usando un percorso assoluto
            DEBUG_DIR=$(dirname "$DEBUG_KEXT_PATH")
            # Entra nella cartella, zippa la kext e salva il file zip nella cartella Products principale
            cd "$DEBUG_DIR" && zip -r "$(pwd)/../../../../Products/AlpsHID-Debug.zip" AlpsHID.kext || zip -r "$GITHUB_WORKSPACE/Products/AlpsHID-Debug.zip" AlpsHID.kext
            cd "$GITHUB_WORKSPACE"
          else
            echo "ERRORE: Impossibile trovare la kext di Debug nella cartella build!"
          fi
          
          # Trova la kext di Release ovunque si trovi dentro build/
          RELEASE_KEXT_PATH=$(find build -type d -name "AlpsHID.kext" | grep -i "release" | head -n 1)
          if [ -n "$RELEASE_KEXT_PATH" ]; then
            echo "Kext Release trovata in: $RELEASE_KEXT_PATH"
            RELEASE_DIR=$(dirname "$RELEASE_KEXT_PATH")
            cd "$RELEASE_DIR" && zip -r "$(pwd)/../../../../Products/AlpsHID-Release.zip" AlpsHID.kext || zip -r "$GITHUB_WORKSPACE/Products/AlpsHID-Release.zip" AlpsHID.kext
            cd "$GITHUB_WORKSPACE"
          else
            echo "ERRORE: Impossibile trovare la kext di Release nella cartella build!"
          fi

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Artifacts
          path: Products/*.zip
          
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Products/*.zip
          tag: ${{ github.ref }}
          file_glob: true
