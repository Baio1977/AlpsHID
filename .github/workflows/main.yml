name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  PROJECT_TYPE: KEXT

jobs:
  build:
    name: Build
    runs-on: macos-15-intel
    env:
      JOB_TYPE: BUILD
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true

      - uses: actions/checkout@v7.0.1
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK
          
      - name: CI Bootstrap
        run: |
          src=$(/usr/bin/curl -Lfs https://raw.githubusercontent.com/acidanthera/ocbuild/master/ci-bootstrap.sh) && eval "$src" || exit 1
          # Reset DEVELOPER_DIR to use the runner's default Xcode, overriding the non-existent version set by the bootstrap script
          unset DEVELOPER_DIR
          echo "DEVELOPER_DIR=" >> "$GITHUB_ENV"

      - name: Build Debug Configuration
        run: xcodebuild -jobs 1 -configuration Debug CODE_SIGNING_ALLOWED=NO SYMROOT="$(pwd)/build"
        
      - name: Build Release Configuration
        run: xcodebuild -jobs 1 -configuration Release CODE_SIGNING_ALLOWED=NO SYMROOT="$(pwd)/build"

      - name: Zip Kexts for Delivery
        run: |
          mkdir -p Products
          
          # Process Debug Kext
          DEBUG_KEXT_PATH=$(find build -type d -name "AlpsHID.kext" | grep -i "debug" | head -n 1)
          if [ -n "$DEBUG_KEXT_PATH" ]; then
            echo "Debug kext found at: $DEBUG_KEXT_PATH"
            DEBUG_DIR=$(dirname "$DEBUG_KEXT_PATH")
            (cd "$DEBUG_DIR" && zip -r "$GITHUB_WORKSPACE/Products/AlpsHID-Debug.zip" AlpsHID.kext)
          else
            echo "ERROR: Unable to find Debug kext in build directory!"
            exit 1
          fi
          
          # Process Release Kext
          RELEASE_KEXT_PATH=$(find build -type d -name "AlpsHID.kext" | grep -i "release" | head -n 1)
          if [ -n "$RELEASE_KEXT_PATH" ]; then
            echo "Release kext found at: $RELEASE_KEXT_PATH"
            RELEASE_DIR=$(dirname "$RELEASE_KEXT_PATH")
            (cd "$RELEASE_DIR" && zip -r "$GITHUB_WORKSPACE/Products/AlpsHID-Release.zip" AlpsHID.kext)
          else
            echo "ERROR: Unable to find Release kext in build directory!"
            exit 1
          fi

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Artifacts
          path: Products/*.zip
          
      - name: Upload to Release
        uses: svenstaro/upload-release-action@2.11.5
        if: github.event_name != 'pull_request'
        with:
         repo_token: ${{ secrets.GITHUB_TOKEN }}
         file: Products/*.zip
         tag: ${{ github.ref }}
         release_name: AlpsHID.kext
         body: ${{ github.event_name != 'release' && github.event.head_commit.message || '' }}
         file_glob: true
